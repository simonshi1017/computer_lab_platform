# Compute Lab · GitLab CI
# 流程：verify（每次提交）→ build（仅 main）→ deploy（手动）

stages:
  - verify
  - build
  - deploy

variables:
  PNPM_VERSION: '11.24.0'

# ---------------- 校验 ----------------
.verify_base:
  stage: verify
  image: node:22-alpine
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

lint:
  extends: .verify_base
  script:
    - pnpm lint

typecheck:
  extends: .verify_base
  script:
    - pnpm typecheck

test:
  extends: .verify_base
  script:
    - pnpm test
    # 后端 seed 依赖 catalog.json，顺手在这里产出并作为产物传给 test:api，
    # 免得 Python 镜像里再装一套 Node
    - pnpm build
  artifacts:
    paths:
      - packages/data/dist/catalog.json
    expire_in: 1 day

test:api:
  stage: verify
  image: python:3.12-slim
  needs: ['test']
  variables:
    # 内网 GitLab Runner 拉 pypi 常常几分钟不动，换源能快一个数量级
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    APP_ENV: test
  script:
    - cd apps/api
    - pip install --no-cache-dir -r requirements-dev.txt
    - python -m pytest

# ---------------- E2E ----------------
# 用官方镜像，浏览器与 @playwright/test 版本必须对齐（见 package.json）
e2e:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.65.0-jammy
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm --filter @clab/web build
  script:
    - pnpm --filter @clab/web e2e
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - apps/web/test-results

# ---------------- 构建镜像 ----------------
# 两个镜像分开构建：前端改文案不该让后端镜像跟着重建（反之亦然）
.build_base:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:web:
  extends: .build_base
  script:
    - docker build -f deploy/Dockerfile -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/web:latest" .
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:latest"

build:api:
  extends: .build_base
  # api 镜像要 COPY packages/data/dist/catalog.json，这个文件由 test job 产出
  needs:
    - job: test
      artifacts: true
  script:
    # api 的构建上下文是仓库根（要拿 catalog.json），所以先构建 data 包
    - docker build -f apps/api/Dockerfile -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/api:latest" .
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/api:latest"

# ---------------- 部署 ----------------
# 需要在 GitLab 里配置：DEPLOY_HOST / DEPLOY_USER / SSH_PRIVATE_KEY
deploy:staging:
  stage: deploy
  image: alpine:3.20
  needs: ['build:web', 'build:api']
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        cd /opt/clab &&
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
        export WEB_IMAGE='$CI_REGISTRY_IMAGE/web:latest' API_IMAGE='$CI_REGISTRY_IMAGE/api:latest' &&
        docker compose -f deploy/docker-compose.yml pull &&
        docker compose -f deploy/docker-compose.yml up -d &&
        docker image prune -f
      "
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
